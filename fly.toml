# AgentSales en Fly.io (spec F8 §4.7 y §4.15, D1, T11): una app, una imagen (`Dockerfile`) y dos
# procesos: `api` (con HTTPS, se apaga sola sin tráfico) y `worker` (sin servicio HTTP; se enciende y
# se apaga a mano en modo demo, o, con el horario activado, lo enciende `worker-schedule.yml` y se
# apaga solo sin trabajo: F9.5-T24, ADR-0037; docs/10-despliegue.md, paso 8). Desplegar es del
# operador (D8): `.github/workflows/deploy.yml`. Sintaxis verificada: docs/integraciones/hosting.md §14.
# Aquí solo va lo que no es secreto; los secretos los pone el operador con `fly secrets import`.
# Es la instancia `principal` (D19 de F9). Otra instancia del mismo código tiene su propio
# `fly.<instancia>.toml`, una copia de este con otra `app`, `PUBLIC_URL`, `Host` del chequeo y
# `BACKUP_R2_BUCKET`: lo que cambies aquí que no sea de la instancia, cámbialo también allá
# (docs/10-despliegue.md, "Una segunda instancia").

app = "agentsales"
primary_region = "gru"        # São Paulo, la misma región que Neon (aws-sa-east-1)
kill_signal = "SIGTERM"       # por defecto Fly manda SIGINT
kill_timeout = 45             # segundos: el worker espera 30 s a sus trabajos (spec §4.10)
swap_size_mb = 512            # para un pico breve del worker (Chromium y ffmpeg)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PUBLIC_URL = "https://agentsales.agentpey.com"
  API_HOST = "0.0.0.0"        # Fly Proxy llega por la red de la máquina, no por 127.0.0.1
  API_PORT = "8080"
  CLIENT_IP_HEADER = "Fly-Client-IP"
  # Simulación hasta que el operador diga lo contrario en el chat (D9): el cambio es suyo.
  PUBLISH_MODE = "dry-run"
  LLM_PROVIDER = "anthropic-api"
  LOG_LEVEL = "info"
  # El respaldo diario va al bucket de respaldos (spec F8 §4.9, D13); su token es un secreto.
  BACKUP_TARGET = "r2"
  BACKUP_R2_BUCKET = "agentsales-backups"
  # El worker se apaga solo tras estos minutos sin trabajo ni nada que venza en los próximos
  # WORKER_STAY_AHEAD_MINUTES (70 por defecto) (F9.5-T24, ADR-0037).
  # Apagado hasta que el operador active el horario (docs/10-despliegue.md, paso 8): sin el workflow
  # que lo enciende, nada programado saldría. Para activarlo, quita el `#` y despliega.
  # WORKER_IDLE_EXIT_MINUTES = "10"

[processes]
  api = "node apps/api/dist/src/server.js"
  worker = "node apps/worker/dist/src/worker.js"

[deploy]
  strategy = "rolling"
  # Las migraciones antes de reemplazar nada, con la imagen nueva y los secretos (son aditivas: la
  # versión anterior sigue funcionando mientras arranca la nueva). Si fallan, el despliegue se corta.
  release_command = "node packages/db/dist/src/scripts/migrate.js"
  release_command_timeout = "5m"
  [deploy.release_command_vm]
    cpu_kind = "shared"
    cpus = 1
    memory = "512mb"

[http_service]
  processes = ["api"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Solo que el proceso responde (`/api/health/live`, sin base): una base despertando no saca la
  # API del balanceo. `/api/health` completo queda para `doctor` y el panel.
  [[http_service.checks]]
    method = "GET"
    path = "/api/health/live"
    protocol = "http"
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    [http_service.checks.headers]
      Host = "agentsales.agentpey.com"

# Solo si sale con error: al apagarse solo (exit 0, F9.5-T24) la máquina queda detenida.
[[restart]]
  policy = "on-failure"
  processes = ["worker"]

[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  # 2 GB (T10, 2026-10-18): el pico medido en el Mac, al armar el reel de un video vertical 4K de
  # 15 s, fue de unos 994 MB (ffmpeg 714 MB, el worker 147 MB, Chromium unos 133 MB). En una máquina
  # de 1 CPU ffmpeg usa menos hilos y debería pedir menos, pero 1 GB quedaría justo (sin medir allí).
  memory = "2gb"
