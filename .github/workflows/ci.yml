# CI de AgentSales (spec F0, T09). Sin secretos: los tests no tocan Neon, R2 ni APIs externas.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: el workflow no escribe en el repositorio.
permissions:
  contents: read

# Un push nuevo cancela la corrida anterior de la misma rama o PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones fijadas por SHA de commit (versión en el comentario): cadena de suministro.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versión de pnpm desde `packageManager` del package.json raíz.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node desde .nvmrc (ADR-0008) y caché del store de pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # ffmpeg 8.1 o más nuevo (spec F2, D6): el de Ubuntu 24.04 (6.1) no arma las fotos HEIC hechas
      # de mosaicos. Build estático de la rama probada en local (9.0.1), del cierre de mes de
      # BtbN/FFmpeg-Builds (esos se conservan), fijado por versión y verificado con sha256. El
      # build GPL trae libx264, que el reel necesita (F2-T08).
      - name: Caché de ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg
          # La clave lleva el sha256: otro archivo nunca reusa la caché de este.
          key: ffmpeg-${{ runner.os }}-n9.0.1-11-ge47273f4d9-linux64-gpl-182c1b509720

      - name: Instalar ffmpeg
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/ffmpeg-n9.0.1-11-ge47273f4d9-linux64-gpl-9.0.tar.xz
          FFMPEG_SHA256: 182c1b509720e939bb47bfb47dc29cc0c298640401128e3dce8627d10707eb5a
          CACHE_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
            echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          fi
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -hide_banner -version | head -1
          "$RUNNER_TEMP/ffmpeg/bin/ffprobe" -hide_banner -version | head -1

      # Falla si el lockfile no coincide; aplica la política de antigüedad de pnpm.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Chromium de Playwright (spec F2, D6): la versión que pide el Playwright del lockfile, con
      # caché por versión. `--with-deps` instala también las librerías del sistema (apt).
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @agentsales/media exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Caché de Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium
        run: pnpm --filter @agentsales/media exec playwright install --with-deps chromium

      - name: Lint, tipos y tests
        run: pnpm check

      # El esquema de Drizzle y las migraciones deben estar sincronizados (deuda F0-T04).
      - name: Migraciones al día
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::El esquema cambió sin migración: corre pnpm db:generate y commitea packages/db/drizzle."
            git status --porcelain packages/db/drizzle
            exit 1
          fi

      # tsc -b no cubre el bundle de Vite.
      - name: Build del panel
        run: pnpm --filter @agentsales/web build
