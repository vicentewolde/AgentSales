# CI de AgentSales (spec F0, T09). Sin secretos: los tests no tocan Neon, R2 ni APIs externas.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: el workflow no escribe en el repositorio.
permissions:
  contents: read

# Un push nuevo cancela la corrida anterior de la misma rama o PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones fijadas por SHA de commit (versión en el comentario): cadena de suministro.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versión de pnpm desde `packageManager` del package.json raíz.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node desde .nvmrc (ADR-0008) y caché del store de pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Falla si el lockfile no coincide; aplica la política de antigüedad de pnpm.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint, tipos y tests
        run: pnpm check

      # El esquema de Drizzle y las migraciones deben estar sincronizados (deuda F0-T04).
      - name: Migraciones al día
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::El esquema cambió sin migración: corre pnpm db:generate y commitea packages/db/drizzle."
            git status --porcelain packages/db/drizzle
            exit 1
          fi

      # tsc -b no cubre el bundle de Vite.
      - name: Build del panel
        run: pnpm --filter @agentsales/web build
