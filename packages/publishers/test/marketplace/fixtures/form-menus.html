<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><title>Marketplace (página local de prueba)</title></head>
  <body>
    <!-- Página inventada para los tests de `fb:smoke --menus`: un menú del formulario cuya lista se
         dibuja fuera del formulario (como suele hacer Facebook) y un menú de la cuenta en la barra. -->
    <header>
      <div role="menu" aria-label="Tu cuenta"><div role="menuitem" tabindex="-1">Nombre Inventado del Operador</div></div>
    </header>
    <main>
      <form aria-label="Propiedad en venta o alquiler">
        <label>Fotos <input type="file" name="fotos" accept="image/*" multiple /></label>
        <div role="combobox" aria-label="Tipo de propiedad" aria-expanded="false" tabindex="0">Tipo de propiedad</div>
        <label>Precio <input type="text" name="precio" /></label>
        <button type="button" id="publicar">Publicar</button>
      </form>
    </main>
    <div role="listbox" aria-label="Tipo de propiedad" id="lista-tipo" hidden>
      <div role="option" tabindex="-1">Departamento</div>
      <div role="option" tabindex="-1">Casa</div>
    </div>
    <script>
      window.__clicks = [];
      document.addEventListener("click", (event) => window.__clicks.push(event.target.textContent));
    </script>
  </body>
</html>
