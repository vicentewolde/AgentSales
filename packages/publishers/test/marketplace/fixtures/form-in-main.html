<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><title>Marketplace (página local de prueba)</title></head>
  <body>
    <!-- Como en Facebook: el formulario dentro de un div role="main" que trae más cosas. -->

      <aside>Vista previa · Nombre Inventado del Operador</aside>

        <label>Fotos <input type="file" /></label>
        <label>Precio <input type="text" name="precio" /></label>
      </form>
    </div>
  </body>
</html>
