<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><title>Marketplace (página local de prueba)</title></head>
  <body>
    <!-- Variante de form.html cuya única sugerencia de ubicación se llama como un botón de enviar. -->
    <!-- Página inventada para los tests: imita el formulario de propiedades de Marketplace con los
         roles y nombres de `selectors.ts` (POR CONFIRMAR con los árboles de `fb:smoke --menus`: se
         rehace desde el árbol real). Registra cada clic en `window.__clicks`. -->
    <header>
      <span>Nombre Inventado del Operador</span> <span>3 mensajes nuevos</span>
      <!-- Opciones de la barra con los mismos textos que el formulario: el llenado nunca las toca. -->
      <div role="listbox" aria-label="Búsquedas recientes">
        <div role="option" id="barra-ubicacion" tabindex="-1">Ñuñoa, Santiago, Chile</div>
        <div role="option" id="barra-operacion" tabindex="-1">Alquiler</div>
      </div>
    </header>
    <main>
      <form aria-label="Propiedad en venta o alquiler">
        <h1>Propiedad en venta o alquiler</h1>
        <label>Fotos <input type="file" name="fotos" accept="image/*" multiple /></label>
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" />
        <div id="miniaturas"></div>
        <div role="combobox" id="combo-operacion" aria-label="Venta o alquiler" aria-expanded="false" aria-controls="lista-operacion" tabindex="0">Venta o alquiler</div>
        <div role="combobox" id="combo-tipo" aria-label="Tipo de propiedad" aria-expanded="false" aria-controls="lista-tipo" tabindex="0">Tipo de propiedad</div>
        <label>Número de habitaciones <input type="text" name="habitaciones" /></label>
        <label>Número de baños <input type="text" name="banos" /></label>
        <label>Precio <input type="text" name="precio" /></label>
        <label>Dirección de la propiedad <input type="text" name="ubicacion" autocomplete="off" /></label>
        <label>Metros cuadrados <input type="text" name="m2" /></label>
        <label>Descripción <textarea name="descripcion"></textarea></label>
        <button type="button" id="siguiente">Siguiente</button>
        <button type="button" id="publicar">Publicar</button>
      </form>
    </main>
    <div role="listbox" id="lista-operacion" aria-label="Venta o alquiler" hidden>
      <div role="option" tabindex="-1">Alquiler</div>
      <div role="option" tabindex="-1">Venta</div>
    </div>
    <div role="listbox" id="lista-tipo" aria-label="Tipo de propiedad" hidden>
      <div role="option" tabindex="-1">Departamento</div>
      <div role="option" tabindex="-1">Casa</div>
      <div role="option" tabindex="-1">Habitación</div>
    </div>
    <div role="listbox" id="sugerencias" aria-label="Sugerencias de ubicación" hidden></div>
    <a id="otro-aviso" href="/marketplace/item/999/">Un aviso de otra persona</a>
    <a id="mis-avisos" href="/marketplace/you/selling/">Tus publicaciones</a>
    <a id="paso-2" href="/marketplace/create/rental/paso-2">Paso 2</a>
    <script>
      window.__clicks = [];
      // Una comuna parecida antes de la buscada: el llenado tiene que elegir la que empieza por ella.
      window.__suggestions = ["Publicar ahora en Ñuñoa"];
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[id], [role=option]");
        window.__clicks.push(target?.id || target?.textContent.trim() || event.target.tagName);
      });
      const combo = (comboId, listId) => {
        const box = document.getElementById(comboId);
        const list = document.getElementById(listId);
        box.addEventListener("click", () => {
          box.setAttribute("aria-expanded", "true");
          list.hidden = false;
        });
        for (const option of list.querySelectorAll("[role=option]")) {
          option.addEventListener("click", () => {
            box.textContent = option.textContent;
            box.dataset.value = option.textContent;
            box.setAttribute("aria-expanded", "false");
            list.hidden = true;
          });
        }
      };
      combo("combo-operacion", "lista-operacion");
      combo("combo-tipo", "lista-tipo");
      const place = document.querySelector('input[name="ubicacion"]');
      const suggestions = document.getElementById("sugerencias");
      place.addEventListener("input", () => {
        window.__typedPlace = place.value;
        suggestions.innerHTML = "";
        for (const text of window.__suggestions) {
          const option = document.createElement("div");
          option.setAttribute("role", "option");
          option.tabIndex = -1;
          option.textContent = text;
          option.addEventListener("click", () => {
            place.value = text;
            place.dataset.value = text;
            suggestions.hidden = true;
          });
          suggestions.append(option);
        }
        suggestions.hidden = place.value === "";
      });
      document.querySelector('input[type="file"]').addEventListener("change", (event) => {
        const thumbnails = document.getElementById("miniaturas");
        for (const file of event.target.files) {
          const image = document.createElement("img");
          image.alt = file.name;
          image.src = URL.createObjectURL(file);
          thumbnails.append(image);
        }
      });
      document.getElementById("publicar").addEventListener("click", () => {
        window.location.href = "/marketplace/item/123/?ref=publicado";
      });
    </script>
  </body>
</html>
